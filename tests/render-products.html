<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tasks 1–3: Product rendering, category, and search checks</title>
</head>
<body>
<h1>Tasks 1–3: Product rendering, category, and search checks</h1>
<p>Serve the workshop over HTTP, then open this page. No test dependencies are required.</p>
<pre id="result">Running checks...</pre>
<iframe id="store" src="../index.html" title="Store under test" hidden></iframe>
<script>
    const result = document.getElementById('result');
    let checks = 0;

    // Stop at the first broken expectation so the page shows the reason for failure.
    // Counting successful checks also confirms that the test reached the final step.
    function check(condition, message) {
        if (!condition) {
            throw new Error(message);
        }
        checks += 1;
    }

    // Compare the visible names with a hand-written list, including their order.
    // Checking the actual cards catches wrong category matches as well as wrong counts.
    function checkProductNames(grid, expectedNames, message) {
        const names = Array.from(grid.querySelectorAll('h3'), heading => heading.textContent.trim());
        check(JSON.stringify(names) === JSON.stringify(expectedNames), message);
    }

    // Set the search field and send the same input event that typing produces.
    // Use the store window's Event constructor because the field lives in its iframe.
    function enterSearch(store, query) {
        const input = store.document.getElementById('search-input');
        input.value = query;
        input.dispatchEvent(new store.Event('input', { bubbles: true }));
    }

    // Wait for the actual store and its scripts, then use real checkbox clicks to
    // exercise every category listener. Afterwards, a small custom product tests
    // rendering without changing products.js or implementing cart logic.
    function runChecks() {
        try {
            const store = document.getElementById('store').contentWindow;
            const grid = store.document.getElementById('product-grid');
            const expectedNames = [
                'Technical Shell Jacket', 'Speedster Running Shoes',
                'Minimalist Quartz Watch', 'Classic Canvas Sneakers',
                'Premium Wireless Headphones', 'Tech Daypack',
                'Urban Explorer Boots', 'Polarized Retro Sunglasses'
            ];
            check(grid.children.length === 8, 'Initial load must show all eight products.');
            checkProductNames(grid, expectedNames, 'Product names or order are incorrect.');

            const all = store.document.querySelector('.category-filter[value="all"]');
            const outerwear = store.document.querySelector('.category-filter[value="Outerwear"]');
            const footwear = store.document.querySelector('.category-filter[value="Footwear"]');
            const accessories = store.document.querySelector('.category-filter[value="Accessories"]');

            all.click();
            checkProductNames(grid, expectedNames, 'No checked categories must show all products.');
            outerwear.click();
            checkProductNames(grid, ['Technical Shell Jacket'], 'Outerwear must show only the jacket.');
            footwear.click();
            checkProductNames(grid, [
                'Technical Shell Jacket', 'Speedster Running Shoes',
                'Classic Canvas Sneakers', 'Urban Explorer Boots'
            ], 'Multiple categories must show their combined products in source order.');
            outerwear.click();
            checkProductNames(grid, [
                'Speedster Running Shoes', 'Classic Canvas Sneakers', 'Urban Explorer Boots'
            ], 'Unchecking Outerwear must leave only Footwear.');
            footwear.click();
            checkProductNames(grid, expectedNames, 'Clearing the last category must restore every product.');
            accessories.click();
            checkProductNames(grid, [
                'Minimalist Quartz Watch', 'Premium Wireless Headphones',
                'Tech Daypack', 'Polarized Retro Sunglasses'
            ], 'Accessories must show all four matching products.');
            all.click();
            checkProductNames(grid, expectedNames, 'All Products must override an active category.');
            outerwear.click();
            checkProductNames(grid, expectedNames, 'All Products must still win when another category is checked.');
            all.click();
            checkProductNames(grid, [
                'Technical Shell Jacket', 'Minimalist Quartz Watch',
                'Premium Wireless Headphones', 'Tech Daypack', 'Polarized Retro Sunglasses'
            ], 'Unchecking All Products must apply the categories that remain checked.');
            accessories.click();
            checkProductNames(grid, ['Technical Shell Jacket'], 'Removing Accessories must leave only Outerwear.');
            outerwear.click();
            checkProductNames(grid, expectedNames, 'Switching categories must not remove products from the source.');
            all.click();
            checkProductNames(grid, expectedNames, 'Selecting All Products alone must show every product.');

            enterSearch(store, 'sHeLl');
            checkProductNames(grid, ['Technical Shell Jacket'], 'Search must match part of a name without case sensitivity.');
            enterSearch(store, 'PoDcAsT');
            checkProductNames(grid, ['Premium Wireless Headphones'], 'Search must match part of a description without case sensitivity.');
            enterSearch(store, 'walks');
            checkProductNames(grid, ['Technical Shell Jacket', 'Urban Explorer Boots'], 'Search must include every matching description in source order.');
            enterSearch(store, '  cAnVaS  ');
            checkProductNames(grid, ['Classic Canvas Sneakers'], 'Surrounding query whitespace must be ignored.');
            enterSearch(store, 'no-such-product');
            checkProductNames(grid, [], 'A query with no matches must clear previous results.');
            enterSearch(store, '');
            checkProductNames(grid, expectedNames, 'Clearing the query must restore every product when All Products is checked.');
            enterSearch(store, '   ');
            checkProductNames(grid, expectedNames, 'A whitespace-only query must behave like an empty query.');

            enterSearch(store, 'walks');
            all.click();
            outerwear.click();
            checkProductNames(grid, ['Technical Shell Jacket'], 'Changing categories must keep the current search query.');
            footwear.click();
            checkProductNames(grid, ['Technical Shell Jacket', 'Urban Explorer Boots'], 'Search must work across multiple selected categories.');
            enterSearch(store, 'canvas');
            checkProductNames(grid, ['Classic Canvas Sneakers'], 'Changing the query must keep the selected categories.');
            enterSearch(store, '');
            checkProductNames(grid, [
                'Technical Shell Jacket', 'Speedster Running Shoes',
                'Classic Canvas Sneakers', 'Urban Explorer Boots'
            ], 'Clearing the query must preserve category filtering.');
            enterSearch(store, 'podcasts');
            checkProductNames(grid, [], 'A matching description outside the selected categories must stay excluded.');
            accessories.click();
            checkProductNames(grid, ['Premium Wireless Headphones'], 'Adding a matching category must restore search results.');
            all.click();
            checkProductNames(grid, ['Premium Wireless Headphones'], 'All Products must override only categories, not the search query.');
            enterSearch(store, 'no-such-product');
            checkProductNames(grid, [], 'All Products must not bypass a query with no matches.');
            enterSearch(store, '');
            checkProductNames(grid, expectedNames, 'Clearing both restrictions must restore the full catalogue.');
            all.click();
            outerwear.click();
            footwear.click();
            accessories.click();
            checkProductNames(grid, expectedNames, 'Search and category changes must preserve all original products.');
            enterSearch(store, 'podcasts');
            checkProductNames(grid, ['Premium Wireless Headphones'], 'No checked categories must still respect the search query.');
            enterSearch(store, '');
            all.click();

            const product = {
                id: 99,
                name: 'Test <b>jacket</b> & "coat"',
                category: 'Test <i>category</i>',
                availability: 'Available <strong>today</strong>',
                price: 1234.5,
                image: 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw=='
            };
            const subset = [product];
            store.renderProducts(subset);
            check(grid.children.length === 1, 'Rendering a subset must replace the previous cards.');
            const card = grid.firstElementChild;
            check(card.tagName === 'ARTICLE', 'Each product must render as an article.');
            check(card.querySelector('h3').textContent === product.name, 'Product name must remain literal text.');
            check(card.querySelector('p').textContent === product.category, 'Category must remain literal text.');
            check(card.querySelector('h3 + p').textContent === product.availability, 'Availability must remain literal text.');
            check(!card.querySelector('b, i, strong'), 'Product text must not create HTML elements.');
            check(card.querySelector('img').getAttribute('src') === product.image, 'Image must use the supplied source.');
            check(card.querySelector('img').alt === product.name, 'Image alt text must identify the product.');
            const expectedPrice = new Intl.NumberFormat(undefined, { style: 'currency', currency: 'SEK' }).format(1234.5);
            check(card.querySelector('span.text-lg').textContent === expectedPrice, 'Price must use SEK currency formatting.');
            check(subset.length === 1 && subset[0] === product, 'Rendering must preserve the supplied array.');

            store.renderProducts(subset);
            check(grid.children.length === 1, 'Rendering twice must not duplicate cards.');
            store.renderProducts([]);
            check(grid.children.length === 0, 'An empty array must clear the grid.');
            store.renderProducts(subset);
            check(grid.children.length === 1, 'Products must render again after an empty result.');
            result.textContent = `PASS: ${checks} checks.`;
        } catch (error) {
            result.textContent = `FAIL after ${checks} checks: ${error.message}`;
            console.error(error);
        }
    }

    document.getElementById('store').addEventListener('load', runChecks);
</script>
</body>
</html>
